<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>學測英文寫作追蹤本</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{
  --paper:#F7F3EA;
  --paper-line:#E4DCC8;
  --ink:#26241F;
  --ink-soft:#6B6656;
  --red:#A63D33;
  --red-soft:#F1DDD8;
  --teal:#3D6B63;
  --teal-soft:#DCE9E4;
  --card:#FFFDF8;
  --gold:#B8863B;
  --gold-soft:#F0E4CC;
}
*{box-sizing:border-box;}
body{
  margin:0;
  background:var(--paper);
  background-image:repeating-linear-gradient(var(--paper) 0 34px, var(--paper-line) 34px 35px);
  color:var(--ink);
  font-family:"Noto Serif TC","Georgia",serif;
  line-height:1.65;
  padding:0 0 60px;
}
header{
  padding:32px 24px 20px;
  border-bottom:2px solid var(--ink);
  max-width:960px;
  margin:0 auto;
}
header h1{
  margin:0 0 6px;
  font-size:26px;
  letter-spacing:2px;
}
header p{
  margin:0;
  color:var(--ink-soft);
  font-size:14px;
}
nav{
  max-width:960px;
  margin:20px auto 0;
  display:flex;
  gap:8px;
  padding:0 24px;
  flex-wrap:wrap;
}
nav button{
  font-family:inherit;
  background:var(--card);
  border:1px solid var(--ink);
  color:var(--ink);
  padding:9px 16px;
  cursor:pointer;
  font-size:14px;
  border-radius:2px;
}
nav button.active{
  background:var(--ink);
  color:var(--paper);
}
main{
  max-width:960px;
  margin:24px auto 0;
  padding:0 24px;
}
.tab{display:none;}
.tab.active{display:block;}
.card{
  background:var(--card);
  border:1px solid var(--paper-line);
  border-left:4px solid var(--red);
  border-radius:2px;
  padding:16px 18px;
  margin-bottom:14px;
}
.card.teal{border-left-color:var(--teal);}
.card.gold{border-left-color:var(--gold);}
.card h3{
  margin:0 0 6px;
  font-size:16px;
}
.tag{
  display:inline-block;
  font-size:11px;
  padding:2px 8px;
  border-radius:10px;
  background:var(--red-soft);
  color:var(--red);
  margin-right:6px;
  margin-bottom:4px;
}
.tag.teal{background:var(--teal-soft);color:var(--teal);}
.tag.gold{background:var(--gold-soft);color:var(--gold);}
.meta{color:var(--ink-soft);font-size:12px;margin-bottom:8px;}
.small{font-size:13px;color:var(--ink-soft);}
input,textarea,select{
  font-family:inherit;
  border:1px solid var(--paper-line);
  background:var(--card);
  padding:8px 10px;
  border-radius:2px;
  color:var(--ink);
  width:100%;
}
.formrow{display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap;}
.formrow>*{flex:1;min-width:120px;}
button.action{
  font-family:inherit;
  background:var(--ink);
  color:var(--paper);
  border:none;
  padding:8px 16px;
  cursor:pointer;
  border-radius:2px;
  font-size:13px;
}
button.del{
  font-family:inherit;
  background:none;
  border:1px solid var(--red);
  color:var(--red);
  padding:4px 10px;
  cursor:pointer;
  border-radius:2px;
  font-size:12px;
}
.essay-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  cursor:pointer;
}
.score-badge{
  background:var(--gold-soft);
  color:var(--gold);
  border-radius:10px;
  padding:2px 10px;
  font-size:13px;
  font-weight:bold;
}
.transcript{
  display:none;
  margin-top:12px;
  padding-top:12px;
  border-top:1px dashed var(--paper-line);
}
.transcript.open{display:block;}
.transcript h4{margin:10px 0 4px;font-size:13px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:1px;}
.transcript p{white-space:pre-wrap;font-size:14px;margin:0;}
.orig{color:var(--ink-soft);}
.corr{color:var(--teal);}
.chart-wrap{background:var(--card);border:1px solid var(--paper-line);padding:16px;margin-bottom:16px;}
.count-badge{
  float:right;
  background:var(--ink);
  color:var(--paper);
  border-radius:10px;
  padding:1px 8px;
  font-size:11px;
}
.loading{padding:40px;text-align:center;color:var(--ink-soft);}

.freshness{
  display:inline-block;
  font-size:11px;
  padding:1px 8px;
  border-radius:10px;
  margin-left:8px;
  vertical-align:1px;
}
.freshness.hot{background:var(--red-soft);color:var(--red);}
.freshness.cool{background:var(--teal-soft);color:var(--teal);}

.clickable{cursor:pointer;position:relative;}
.clickable:hover{border-left-color:var(--gold);}
.hint-arrow{
  position:absolute;
  right:16px;
  top:16px;
  font-size:12px;
  color:var(--gold);
}
.modal-overlay{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(38,36,31,0.55);
  z-index:100;
  align-items:center;
  justify-content:center;
  padding:20px;
}
.modal-overlay.open{display:flex;}
.modal-box{
  background:var(--card);
  max-width:600px;
  width:100%;
  max-height:80vh;
  overflow-y:auto;
  border-radius:4px;
  border-top:4px solid var(--gold);
  padding:24px 28px;
  position:relative;
}
.modal-close{
  position:absolute;
  top:14px;
  right:14px;
  background:none;
  border:none;
  font-size:18px;
  cursor:pointer;
  color:var(--ink-soft);
}
.modal-box h3{margin:0 0 14px;font-size:19px;}
.modal-box h4{margin:14px 0 6px;font-size:13px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:1px;}
.modal-box p{margin:0 0 4px;font-size:15px;line-height:1.7;}
.modal-box ul{margin:4px 0 0;padding-left:20px;}
.modal-box li{font-size:14px;line-height:1.8;color:var(--teal);}
</style>
</head>
<body>

<header>
  <h1>學測英文寫作追蹤本</h1>
  <p>持續追蹤弱點模式、進步趨勢與作品集 · 資料自動儲存</p>
</header>

<nav>
  <button data-tab="weak" class="active">弱點追蹤</button>
  <button data-tab="trend">持續弱點總覽</button>
  <button data-tab="progress">進步趨勢</button>
  <button data-tab="portfolio">作品集</button>
</nav>

<main>

  <section id="weak" class="tab active">
    <div id="weak-list"></div>
  </section>

  <section id="trend" class="tab">
    <div id="trend-list"></div>
  </section>

  <section id="progress" class="tab">
    <div class="chart-wrap"><canvas id="progressChart" height="110"></canvas></div>
    <div id="progress-table"></div>
  </section>

  <section id="portfolio" class="tab">
    <div id="portfolio-list"></div>
  </section>
</main>

<div id="modal-overlay" class="modal-overlay" onclick="if(event.target===this) closeExplain()">
  <div class="modal-box">
    <button class="modal-close" onclick="closeExplain()">✕</button>
    <h3 id="modal-title"></h3>
    <div id="modal-body"></div>
  </div>
</div>

<script>
let weakData = [];
let portfolioData = [];

async function loadAll(){
  try{
    const res = await fetch("./data.json");
    const json = await res.json();
    weakData = json.weak;
    portfolioData = json.portfolio;
  }catch(e){
    document.querySelector("main").innerHTML =
      "<div class='card'><h3>資料載入失敗</h3><p class='small'>找不到 data.json，請確認這個檔案跟 index.html 放在同一層目錄。</p></div>";
    console.error(e);
    return;
  }
  renderWeak();
  renderTrend();
  renderProgress();
  renderPortfolio();
}

/* ---------- 新舊程度：距離最近一次犯錯隔了幾篇作文 ---------- */
function freshness(w){
  const last = w.lastSeen || w.date;           // 舊資料沒有 lastSeen 就退回用 date
  const since = portfolioData.filter(p => p.date > last).length;
  return since === 0
    ? { last, html:`<span class="freshness hot">最新一篇仍出現</span>` }
    : { last, html:`<span class="freshness cool">已 ${since} 篇未出現</span>` };
}

/* ---------- 弱點追蹤（唯讀顯示） ---------- */
function renderWeak(){
  const list = document.getElementById("weak-list");
  // 依「最近一次出現」由新到舊排序，還在犯的排最前面
  const sorted = [...weakData].sort((a,b)=>
    (b.lastSeen || b.date).localeCompare(a.lastSeen || a.date));
  list.innerHTML = sorted.map(w=>{
    const hasExplain = !!w.explain;
    const f = freshness(w);
    return `
    <div class="card ${hasExplain?'clickable':''}" ${hasExplain?`onclick="openExplain('${w.id}')"`:''}>
      <span class="count-badge">共出現 ${w.count} 次</span>
      <h3>${w.cat}</h3>
      <div class="meta">首次記錄：${w.date} · 最近出現：${f.last}${f.html}</div>
      <div class="small">${w.desc}</div>
    </div>
  `;}).join("");
}

/* ---------- 持續弱點總覽 ---------- */
function renderTrend(){
  const list = document.getElementById("trend-list");
  const sorted = [...weakData].sort((a,b)=> b.count - a.count);
  list.innerHTML = sorted.map(w=>{
    const hasExplain = !!w.explain;
    return `
    <div class="card teal ${hasExplain?'clickable':''}" ${hasExplain?`onclick="openExplain('${w.id}')"`:''}>
      <span class="count-badge">${w.count} 次</span>
      <h3>${w.cat}${freshness(w).html}</h3>
      <div class="small">${w.desc}</div>
    </div>
  `;}).join("");
}

/* ---------- 解說彈窗 ---------- */
function openExplain(id){
  const w = weakData.find(x=>x.id===id);
  if(!w || !w.explain) return;
  document.getElementById("modal-title").textContent = w.cat;

  if(w.explain.type === "wordlist"){
    const rows = [...w.explain.words].sort((a,b)=> b.count - a.count);
    document.getElementById("modal-body").innerHTML = `
      <h4>錯誤／正確對照（依出現次數排序）</h4>
      <ul>${rows.map(x=>`<li><b>${x.wrong}</b> → ${x.correct}　<span style="color:var(--ink-soft);">(${x.count}次${x.note? '，'+x.note : ''})</span></li>`).join("")}</ul>
    `;
  }else{
    document.getElementById("modal-body").innerHTML = `
      <h4>規則說明</h4>
      <p>${w.explain.rule}</p>
      <h4>例句對照</h4>
      <ul>${w.explain.examples.map(e=>`<li>${e}</li>`).join("")}</ul>
    `;
  }
  document.getElementById("modal-overlay").classList.add("open");
}
function closeExplain(){
  document.getElementById("modal-overlay").classList.remove("open");
}

/* ---------- 進步趨勢 ---------- */
let chartRef = null;
function renderProgress(){
  const sorted = [...portfolioData].sort((a,b)=> a.date.localeCompare(b.date));
  const labels = sorted.map(p=> p.date + " " + p.title.slice(0,8));
  const scores = sorted.map(p=> p.score);

  const ctx = document.getElementById("progressChart").getContext("2d");
  if(chartRef) chartRef.destroy();
  chartRef = new Chart(ctx, {
    type:"line",
    data:{
      labels,
      datasets:[{
        label:"作文分數 /20",
        data:scores,
        borderColor:"#A63D33",
        backgroundColor:"#F1DDD8",
        tension:0.25,
        pointRadius:5,
        pointBackgroundColor:"#A63D33",
        fill:true,
      }]
    },
    options:{
      scales:{ y:{ min:0, max:20 } },
      plugins:{ legend:{ display:false } }
    }
  });

  const table = document.getElementById("progress-table");
  table.innerHTML = sorted.map(p=>`
    <div class="card gold">
      <span class="score-badge">${p.score} / 20</span>
      <h3>${p.title}</h3>
      <div class="meta">${p.date}</div>
    </div>
  `).join("");
}

/* ---------- 作品集 ---------- */
function renderPortfolio(){
  const list = document.getElementById("portfolio-list");
  const sorted = [...portfolioData].sort((a,b)=> b.date.localeCompare(a.date));
  list.innerHTML = sorted.map(p=>`
    <div class="card">
      <div class="essay-header" onclick="toggleT('${p.id}')">
        <h3>${p.title}</h3>
        <span class="score-badge">${p.score} / 20</span>
      </div>
      <div class="meta">${p.date}</div>
      <div class="small">${p.prompt}</div>
      <div class="transcript" id="t-${p.id}">
        <h4>原文</h4>
        <p class="orig">${p.original}</p>
        <h4>批改後版本</h4>
        <p class="corr">${p.corrected}</p>
        <h4>備註</h4>
        <p class="small">${p.note}</p>
      </div>
    </div>
  `).join("");
}
function toggleT(id){
  document.getElementById("t-"+id).classList.toggle("open");
}

/* ---------- Tab 切換 ---------- */
document.querySelectorAll("nav button").forEach(btn=>{
  btn.addEventListener("click", ()=>{
    document.querySelectorAll("nav button").forEach(b=>b.classList.remove("active"));
    document.querySelectorAll(".tab").forEach(t=>t.classList.remove("active"));
    btn.classList.add("active");
    document.getElementById(btn.dataset.tab).classList.add("active");
  });
});

loadAll();
</script>
</body>
</html>
